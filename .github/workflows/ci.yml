name: Linux
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        rust: ['1.75.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '${{ matrix.rust }}'
          components: rustfmt, clippy
      - run: make
      - name: Run make test
        run: |
          set +e
          make test > /tmp/validator-test-output.log 2>&1
          test_status=$?
          cat /tmp/validator-test-output.log
          if [ "$test_status" -ne 0 ]; then
            python3 - <<'PYCODE'
          from pathlib import Path
          tail = "\n".join(Path("/tmp/validator-test-output.log").read_text().splitlines()[-80:])
          tail = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Validator tests::{tail}")
          PYCODE
          fi
          exit "$test_status"
      - run: make check
      - run: node --test tests/report.test.cjs
      - run: ./validator-v4l2 software --frames 4
